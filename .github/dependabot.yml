version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Bun manages this repo (bun.lock, no package-lock.json). The "npm"
  # ecosystem cannot update bun.lock and fails with `misconfigured_tooling`.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
