version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Bun manages this repo (bun.lock, no package-lock.json). The "npm"
  # ecosystem cannot update bun.lock and fails with `misconfigured_tooling`.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 removes baseUrl and rejects the repo's path aliases, so
      # the toolchain needs a deliberate tsconfig migration first.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
