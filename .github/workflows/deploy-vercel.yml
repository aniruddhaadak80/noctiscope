name: deploy-vercel
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Detect VERCEL_TOKEN
        id: token
        run: echo "has_token=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Deploy (skipped until the VERCEL_TOKEN secret is set)
        if: steps.token.outputs.has_token == 'true'
        run: |
          bunx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          bunx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          bunx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Skipping manual deploy (Vercel Git integration is the primary path)
        if: steps.token.outputs.has_token != 'true'
        run: |
          echo "VERCEL_TOKEN is not configured in repo secrets."
          echo "Vercel Git integration on push-to-main already handles production."
          echo "Set VERCEL_TOKEN later to restore this manual deployment path."
